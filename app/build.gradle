
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moze3.sennbelawen'
    compileSdk 35

    defaultConfig {
        applicationId 'com.moze3.sennbelawen'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("SIGNING_KEYSTORE_FILE") ?: "missing.jks")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
